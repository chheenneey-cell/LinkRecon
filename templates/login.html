<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>登录 · LinkRecon 暗链扫描系统</title>
<style>
:root{
  --bg:#080d14; --surface:#0d1520; --surface-2:#111c2a;
  --border:#1a2636; --border-l:#223040;
  --accent:#00ff88; --accent-g:rgba(0,255,136,.1); --accent-gs:rgba(0,255,136,.2);
  --cyan:#00d4ff; --red:#ff4d5e;
  --text:#e6edf3; --muted:#7d8da0; --input-bg:#060a10;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  font-family:'DM Mono','Cascadia Mono','JetBrains Mono',Consolas,monospace;
  background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; position:relative; overflow:hidden;
}
/* 背景网格，和控制台的终端观感保持一致 */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),
                   linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:44px 44px; opacity:.35;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 100%);
}
.card{
  position:relative; width:100%; max-width:420px;
  background:linear-gradient(145deg,var(--surface),var(--surface-2));
  border:1px solid var(--border-l); border-radius:14px;
  padding:36px 32px 30px; box-shadow:0 24px 64px rgba(0,0,0,.55);
}
.card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  border-radius:14px 14px 0 0;
  background:linear-gradient(90deg,var(--accent),var(--cyan));
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 12px var(--accent)}
.brand-name{font-size:1.15rem;font-weight:600;letter-spacing:.04em}
.brand-sub{color:var(--muted);font-size:.78rem;margin-bottom:26px;letter-spacing:.06em}
label{display:block;font-size:.78rem;color:var(--muted);margin:0 0 7px;letter-spacing:.05em}
.field{margin-bottom:16px}
input[type=text],input[type=password]{
  width:100%; padding:11px 13px; font-family:inherit; font-size:.92rem;
  background:var(--input-bg); color:var(--text);
  border:1px solid var(--border-l); border-radius:7px; outline:none;
  transition:border-color .15s,box-shadow .15s;
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-g)}
.row{display:flex;align-items:center;gap:8px;margin:4px 0 20px}
.row input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
.row label{margin:0;cursor:pointer;font-size:.8rem;color:var(--muted)}
button{
  width:100%; padding:12px; font-family:inherit; font-size:.95rem; font-weight:600;
  letter-spacing:.06em; color:#04120a; cursor:pointer;
  background:linear-gradient(90deg,var(--accent),var(--cyan));
  border:none; border-radius:7px; transition:filter .15s,transform .06s;
}
button:hover{filter:brightness(1.1)}
button:active{transform:translateY(1px)}
.alert{
  padding:11px 13px; border-radius:7px; font-size:.82rem; line-height:1.5;
  margin-bottom:20px; border:1px solid;
}
.alert.error{background:rgba(255,77,94,.08);border-color:rgba(255,77,94,.35);color:#ff8f9a}
.alert.info{background:var(--accent-g);border-color:var(--accent-gs);color:var(--accent)}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--border);
  color:var(--muted);font-size:.72rem;line-height:1.6}
.foot code{color:var(--cyan);font-size:.72rem}
</style>
</head>
<body>
<form class="card" method="post" action="{{ action }}" autocomplete="on">
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">LinkRecon</span>
  </div>
  <div class="brand-sub">暗链接扫描系统</div>

  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  {% if notice %}<div class="alert info">{{ notice }}</div>{% endif %}

  <div class="field">
    <label for="username">用户名</label>
    <input type="text" id="username" name="username" value="{{ username }}"
           autocomplete="username" required autofocus maxlength="64">
  </div>
  <div class="field">
    <label for="password">口令</label>
    <input type="password" id="password" name="password"
           autocomplete="current-password" required maxlength="256">
  </div>

  <div class="row">
    <input type="checkbox" id="remember" name="remember" value="1">
    <label for="remember">保持登录 7 天</label>
  </div>

  <input type="hidden" name="next" value="{{ next_url }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <button type="submit">登 录</button>

  <div class="foot">
    忘记口令可在服务器上执行 <code>python -m core.auth passwd &lt;用户名&gt;</code> 重置。<br>
    本服务仅监听 127.0.0.1，请勿对外暴露。
  </div>
</form>
</body>
</html>
